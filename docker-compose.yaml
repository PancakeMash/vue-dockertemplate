services:
  db:
    container_name: ${DB_CONTAINER_NAME}
    image: postgres:18
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - ${DB_INTERNAL_PORT}:${DB_EXTERNAL_PORT}
    env_file:
      - .env
  backend:
    container_name: ${API_CONTAINER_NAME}
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - ${API_PORT}:${API_PORT}
      - "5555:5555"
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DB_URL}
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: 'pnpm run api:dev'

  frontend:
    container_name: ${VUE_CONTAINER_NAME}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - ${VUE_EXTERNAL_PORT}:${VUE_INTERNAL_PORT}
    env_file:
      - .env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: 'pnpm run dev --host --port ${VUE_INTERNAL_PORT}'
