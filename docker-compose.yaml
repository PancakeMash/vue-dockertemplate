services:
  backend:
    container_name: ${API_CONTAINER_NAME}
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - ${API_PORT}:${API_PORT}
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
      - /app/node_modules
    command: 'pnpm run api:dev'

  frontend:
    container_name: ${VUE_CONTAINER_NAME}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - ${VUE_EXTERNAL_PORT}:${VUE_INTERNAL_PORT}
    env_file:
      - .env
    volumes:
      - .:/app/frontend
      - /app/node_modules
    command: 'pnpm run dev --host --port ${VUE_INTERNAL_PORT}'
