services:
  backend:
    container_name: backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - ${API_PORT}:${API_PORT}
    volumes:
      - ./backend:/app/backend
      - /app/node_modules
    command: 'pnpm run api:dev'

